version: "3.9"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: coffeenchill-azurite
    command: "azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - coffeenet

  functions:
    image: 1047704/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions
    depends_on:
      - azurite
    ports:
      - "8080:80"
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - AzureFunctionsJobHost_LoggingLogLevel_Default=Information
      - AzureFunctionsJobHost_LoggingLogLevel_Microsoft=Debug
    networks:
      - coffeenet

networks:
  coffeenet:
    driver: bridge

volumes:
  azurite-data:
